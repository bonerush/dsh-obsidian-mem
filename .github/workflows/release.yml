# The release path a push into `main` takes (policy: README → Development).
#
# This repository publishes no npm package. A release is a git tag plus a GitHub
# Release, and this workflow mints both. The owner's rule is "a push is a
# release": `0.0.1` for a push, `0.1` for a notable feature, `1` for a breaking
# change. The first two are therefore mechanical and happen here; a major bump is
# a person editing `package.json` before the push, because nothing can infer
# "breaking" from a diff.
#
# Three decisions are load-bearing:
#
#   * **The bootstrap runs before the skip guard.** A version with no tag wants a
#     tag whether a human or this workflow produced the commit, and that is the
#     only way the first release can come out of this file at all.
#   * **The skip guard exists because a release commit has nothing left to release.**
#     A bump commit moves every entry out of `## Unreleased` — that is what the
#     changelog gate below demands — so a second pass would have nothing to write
#     into the next section and would bump an already-released number again.
#   * **The changelog gate runs before the bump.** The open question under the
#     owner's rule is what "a release every push" does to a changelog whose gate
#     refuses an empty `## Unreleased` for any `lib/` change. The answer taken
#     here is not to weaken the gate: a push into `main` must leave a real entry
#     behind, the workflow says so in one line, and the push is refused rather
#     than published under a number nobody documented. `[skip ci]` is not used,
#     because it would also skip the bootstrap above.
name: release

on:
  push:
    branches: [main]

# One release at a time, and never a half-applied bump: a queued run waits, and a
# cancelled one leaves the tree exactly as it found it.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci

      # The token has to be part of the remote URL. With the default credential
      # helper a push made with a token is attributed to github-actions[bot],
      # `GITHUB_TOKEN` is suppressed on it, and the `version` guard below would
      # then see "no tag for this version" on every run and bump forever.
      - name: Point origin at the token
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      # The plugin and the Codex adapter have to agree on the version they carry,
      # and the tests have to pass before a number is attached to the tree.
      - run: npm run check

      - name: Release the current version when it carries no tag
        id: bootstrap
        run: |
          version="$(node -p 'require("./package.json").version')"
          if git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
            echo "tagged=v${version}" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the version the repository already declares
        if: steps.bootstrap.outputs.tagged != ''
        env:
          TAG: ${{ steps.bootstrap.outputs.tagged }}
        run: |
          git tag -a "$TAG" -m "dsh-obsidian-mem $TAG"
          git push origin "$TAG"

      - name: Stop before a release commit re-releases itself
        id: guard
        if: steps.bootstrap.outputs.tagged == ''
        run: |
          if [[ "${{ github.event.head_commit.message }}" == chore\(release\):* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The gate the repository already enforces in CI, asked here as the release
      # precondition. `node scripts/verify-changelog.mjs --staged` reads the
      # changelog out of the index, so the entry has to be staged to be judged.
      - name: Require a real changelog entry for this push
        if: steps.guard.outputs.skip == 'false'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! node scripts/verify-changelog.mjs --base "$BEFORE"; then
            echo "::error::This push changed lib/ without adding an entry under '## Unreleased' in CHANGELOG.md." >&2
            echo "::error::Add it and push again: a release every push needs something to write into the next section." >&2
            exit 1
          fi

      - name: Bump the patch, cut the section, commit and tag
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          branch="$(git rev-parse --abbrev-ref HEAD)"

          # The version bump and the changelog move together: a tag is only
          # allowed to name a version whose changelog section exists.
          npm version patch --no-git-tag-version
          next="$(node -p 'require("./package.json").version')"
          node -e '
            const fs = require("node:fs")
            const [file, version, date] = process.argv.slice(1)
            const heading = "## Unreleased"
            const text = fs.readFileSync(file, "utf8")
            const lines = text.split("\n")
            const start = lines.findIndex((line) => line.trim() === heading)
            if (start === -1) throw new Error("CHANGELOG.md has no " + heading + " section")
            const rest = lines.slice(start + 1)
            const end = rest.findIndex((line) => /^## /.test(line))
            const body = (end === -1 ? rest : rest.slice(0, end)).join("\n").trim()
            if (body === "") throw new Error("the " + heading + " section is empty; nothing to release")
            const tail = end === -1 ? [] : rest.slice(end)
            const cut = [heading, "", "## " + version + " — " + date, "", body, "", ...tail]
            fs.writeFileSync(file, [...lines.slice(0, start), ...cut].join("\n"))
          ' CHANGELOG.md "$next" "$today"
          node -e '
            const fs = require("node:fs")
            const version = process.argv[1]
            const manifest = JSON.parse(fs.readFileSync("dsh.plugin.json", "utf8"))
            manifest.version = version
            fs.writeFileSync("dsh.plugin.json", JSON.stringify(manifest, null, 2) + "\n")
            const server = fs.readFileSync("codex/server.mjs", "utf8")
            fs.writeFileSync(
              "codex/server.mjs",
              server.replace(/name: .dsh-obsidian-mem., version: .[^\x27"]+./, `name: \x27dsh-obsidian-mem\x27, version: \x27${version}\x27`),
            )
          ' "$next"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json dsh.plugin.json codex/server.mjs CHANGELOG.md
          git commit -m "chore(release): ${next}"
          git tag -a "v${next}" -m "dsh-obsidian-mem v${next}"
          git push origin "HEAD:${branch}" "v${next}"

      - name: Publish the release
        if: steps.bootstrap.outputs.tagged != '' || steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bootstrap.outputs.tagged }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then version="${TAG#v}"; else version="$(node -p 'require("./package.json").version')"; fi
          gh release view "v${version}" > /dev/null 2>&1 && exit 0
          notes="$(mktemp)"
          node -e '
            const fs = require("node:fs")
            const [file, version] = process.argv.slice(1)
            const lines = fs.readFileSync(file, "utf8").split("\n")
            const start = lines.findIndex((line) => line.startsWith("## " + version + " "))
            if (start === -1) throw new Error("no changelog section for " + version)
            const rest = lines.slice(start + 1)
            const end = rest.findIndex((line) => /^## /.test(line))
            fs.writeFileSync(file, (end === -1 ? rest : rest.slice(0, end)).join("\n").trim() + "\n")
          ' CHANGELOG.md "$version" > "$notes"
          gh release create "v${version}" --title "dsh-obsidian-mem v${version}" --notes-file "$notes"
