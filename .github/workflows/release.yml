# The release path a push into `main` takes (policy: README → Development).
#
# This repository publishes no npm package. A release is a git tag plus a GitHub
# Release, and this workflow mints both. The owner's rule is "a push is a
# release": `0.0.1` for a push, `0.1` for a notable feature, `1` for a breaking
# change. The first two are mechanical and happen here; a major bump is a person
# editing `package.json` before the push, because nothing can infer "breaking"
# from a diff.
#
# Every push lands in exactly one of two branches, and the classification is
# explicit rather than inferred from an `if:` chain:
#
#   * **bootstrap** — `package.json` names a version that has no tag yet. That
#     version is tagged and released as it stands, and the job stops. This is how
#     the first release can come out of this file at all, and how a version a
#     person prepared by hand (0.1, or 1) becomes a release without the workflow
#     bumping it back down to the next patch.
#   * **bump** — the declared version is already tagged, so this push releases
#     the *next* patch. A release commit is excluded here, because it has nothing
#     left to release: it moves every entry out of `## Unreleased`.
#
# Why the guard cannot simply be "skip release commits": once a version is
# tagged, bumping is the only branch left, so a guard that excluded both would
# leave a push with nothing to do at all. The bootstrap branch is what makes the
# guard safe.
#
# The changelog token is buy-in, not an oversight: the owner asked for a release
# every push, and the repository's gate refuses a `lib/` change with no entry
# under `## Unreleased`. Rather than weaken the gate, a push into `main` must
# leave a real entry behind and the job refuses the push in one line when it does
# not. `[skip ci]` is not used for the release commit, because it would also skip
# the run that would otherwise tag a hand-prepared version.
name: release

on:
  push:
    branches: [main]

# One release at a time, and never a half-applied bump: a queued run waits, and a
# cancelled one leaves the tree exactly as it found it.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci

      # The token has to be part of the remote URL. With the default credential
      # helper a push made with a token is attributed to github-actions[bot],
      # which suppresses `GITHUB_TOKEN` on the resulting push event — measured on
      # this repository: the 0.1.2 release commit fired no second run. That is the
      # behaviour wanted here, and spelling out the token keeps it deliberate.
      - name: Point origin at the token
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      # The plugin and the Codex adapter have to agree on the version they carry,
      # and the tests have to pass before a number is attached to the tree.
      - run: npm run check

      # A checkout carries no tags, so "does this version already have one?" has
      # to ask the remote. `resolved` is what the later gates read, so a bootstrap
      # run never also bumps.
      - name: Classify this push
        id: classify
        run: |
          version="$(node -p 'require("./package.json").version')"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null 2>&1; then
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            echo "this push releases the next patch: v${version} is already tagged"
          else
            echo "resolved=true" >> "$GITHUB_OUTPUT"
            echo "this push releases the declared version as it stands: v${version} has no tag"
          fi

      # Idempotent on purpose. The first version of this step only tested whether
      # a tag existed and then created it unconditionally, so once v0.1.1 was
      # published by hand the next run saw the tag, took this branch, and died on
      # `git tag` with exit 128.
      - name: Tag the version the repository already declares, and release it
        if: steps.classify.outputs.resolved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
            echo "${tag} is already tagged; nothing to do"
            exit 0
          fi
          git tag -a "$tag" -m "dsh-obsidian-mem ${tag}"
          git push origin "$tag"
          notes="$(mktemp)"
          node -e '
            const fs = require("node:fs")
            const [file, version] = process.argv.slice(1)
            const lines = fs.readFileSync(file, "utf8").split("\n")
            const start = lines.findIndex((line) => line.startsWith("## " + version + " "))
            if (start === -1) throw new Error("no changelog section for " + version)
            const rest = lines.slice(start + 1)
            const end = rest.findIndex((line) => /^## /.test(line))
            fs.writeFileSync(file, (end === -1 ? rest : rest.slice(0, end)).join("\n").trim() + "\n")
          ' CHANGELOG.md "$version" > "$notes"
          # The prebuilt archive rides the release, so a marketplace entry can
          # point `tarball:` at a pinned asset URL instead of making every user
          # build from source. `--ignore-scripts` because `npm run check` above
          # already ran `prepack`; the default would run the whole suite twice.
          npm pack --ignore-scripts --pack-destination .
          gh release create "$tag" --title "dsh-obsidian-mem ${tag}" --notes-file "$notes" ./*.tgz

      # A release commit has nothing left to release, so it is the one push that
      # does not produce a version of its own.
      - name: Stop before a release commit re-releases itself
        id: guard
        if: steps.classify.outputs.resolved == 'false'
        # The message reaches the script through the environment, never through
        # `${{ }}` interpolation into the shell text. A commit body is arbitrary
        # text: the first version inlined it, and a multi-line message containing
        # backticks broke bash with "conditional binary operator expected" —
        # a release that failed because of how its own commit message was quoted.
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == chore\(release\):* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The repository's own gate, asked here as the release precondition.
      - name: Require a real changelog entry for this push
        if: steps.guard.outputs.skip == 'false'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! node scripts/verify-changelog.mjs --base "$BEFORE"; then
            echo "::error::This push changed lib/ without adding an entry under '## Unreleased' in CHANGELOG.md." >&2
            echo "::error::Add it and push again: a release every push needs something to write into the next section." >&2
            exit 1
          fi

      - name: Bump the patch, cut the section, commit, tag and release
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          branch="$(git rev-parse --abbrev-ref HEAD)"

          # The version bump and the changelog move together: a tag is only
          # allowed to name a version whose changelog section exists. The section
          # is placed by version number rather than at the top — `v0.1.1` was
          # tagged after `v0.1.2` had shipped, and inserting above it left the
          # file reading 0.1.3, 0.1.1, 0.1.2 — so `scripts/changelog-order.mjs`
          # owns both the cut and the ordering, and its own tests cover it.
          npm version patch --no-git-tag-version
          next="$(node -p 'require("./package.json").version')"
          node scripts/changelog-order.mjs --cut "$next" "$today"
          node -e '
            const fs = require("node:fs")
            const version = process.argv[1]
            const manifest = JSON.parse(fs.readFileSync("dsh.plugin.json", "utf8"))
            manifest.version = version
            fs.writeFileSync("dsh.plugin.json", JSON.stringify(manifest, null, 2) + "\n")
            const server = fs.readFileSync("codex/server.mjs", "utf8")
            fs.writeFileSync(
              "codex/server.mjs",
              server.replace(/name: .dsh-obsidian-mem., version: .[^\x27"]+./, `name: \x27dsh-obsidian-mem\x27, version: \x27${version}\x27`),
            )
          ' "$next"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json dsh.plugin.json codex/server.mjs CHANGELOG.md
          git commit -m "chore(release): ${next}"
          git tag -a "v${next}" -m "dsh-obsidian-mem v${next}"
          git push origin "HEAD:${branch}" "v${next}"

          notes="$(mktemp)"
          node -e '
            const fs = require("node:fs")
            const [file, version] = process.argv.slice(1)
            const lines = fs.readFileSync(file, "utf8").split("\n")
            const start = lines.findIndex((line) => line.startsWith("## " + version + " "))
            if (start === -1) throw new Error("no changelog section for " + version)
            const rest = lines.slice(start + 1)
            const end = rest.findIndex((line) => /^## /.test(line))
            fs.writeFileSync(file, (end === -1 ? rest : rest.slice(0, end)).join("\n").trim() + "\n")
          ' CHANGELOG.md "$next" > "$notes"
          # Same prebuilt archive as the bootstrap branch. `npm pack` writes
          # `dsh-obsidian-mem-<version>.tgz` into the checkout, not into the
          # commit, so the release commit stays clean.
          npm pack --ignore-scripts --pack-destination .
          if gh release view "v${next}" > /dev/null 2>&1; then
            gh release upload "v${next}" ./*.tgz --clobber
          else
            gh release create "v${next}" --title "dsh-obsidian-mem v${next}" --notes-file "$notes" ./*.tgz
          fi

      # The listed entry pins `tarball:` at a tag, so every release owes the
      # curated list one line. Both branches call it, because either can be the
      # one that creates the release, and the version is named outright rather
      # than re-derived: in the bump branch a re-derivation would look for a
      # tag on a commit that is no longer HEAD.
      #
      # `GH_TOKEN` is this repository's own token for reading its releases, and
      # `MARKETPLACE_TOKEN` is the fine-grained one that may write the fork and
      # open the pull request. Each step probes that credential first
      # (`--check-token`) and downgrades a refusal to a warning.
      #
      # The earlier shape exited 1 with two `::error::` lines, on the argument
      # that "an unannounced stale entry is worse than a red run". The announcement
      # was never the problem — the *label* was: the notification read
      # "release: All jobs have failed" for a run whose tag, tarball and GitHub
      # Release had all been created before this step began, and what the step
      # wanted is an open pull request on a repository this one does not own
      # (measured 2026-09-29: that PR pointed at v0.1.6 while v0.1.9 was published
      # and tagged). A run that calls a published release failed teaches its reader
      # to ignore the colour; the `::warning::` names the missing permission on
      # every run instead, and stays in the annotations.
      - name: Point the marketplace entry at the bootstrap release
        if: steps.classify.outputs.resolved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          set -euo pipefail
          if ! node scripts/marketplace-entry.mjs --check-token; then
            echo "::warning::The release is published; the marketplace entry is behind. MARKETPLACE_TOKEN needs Contents: Read and write plus Pull requests: Read and write on the fork, then run 'node scripts/marketplace-entry.mjs' locally or re-run this job."
            exit 0
          fi
          node scripts/marketplace-entry.mjs

      - name: Point the marketplace entry at the bumped release
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if ! node scripts/marketplace-entry.mjs --check-token "$version"; then
            echo "::warning::The release is published; the marketplace entry is behind. MARKETPLACE_TOKEN needs Contents: Read and write plus Pull requests: Read and write on the fork, then run 'node scripts/marketplace-entry.mjs ${version}' locally or re-run this job."
            exit 0
          fi
          node scripts/marketplace-entry.mjs "$version"
