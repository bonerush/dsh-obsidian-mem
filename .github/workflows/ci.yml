# The same gates a contributor runs, run again where nobody can skip them.
#
# `npm run check` is the whole local gate and this workflow does not add steps to
# it — a CI-only check is one that passes locally and fails on push. The two extra
# steps are the ones that need something the local gate deliberately does not have:
# a comparison base for the Unreleased gate, and the Node matrix.
#
# The matrix carries Windows legs so "Windows supported" is a claim CI enforces
# rather than one a contributor discovers in a session. They run the identical
# steps: no `if: runner.os` shortcut and no `continue-on-error`. `.gitattributes`
# pins every checkout to LF, which is what makes `npm run check` mean the same
# thing on a Windows runner as on Linux.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.22.2 is the engines floor — the lowest version measured to ship
        # node:sqlite with FTS5 — and it is listed first because an unmeasured
        # floor is just a claim. 'node' tracks current so a break shows up here
        # rather than in a user's session.
        os: [ubuntu-latest]
        node: ['22.22.2', '24.x', 'node']
        include:
          # One Windows leg per supported LTS, on the same `npm run check` the
          # ubuntu legs run (the steps below read `matrix.os`, so they are the
          # same steps). 'node' stays ubuntu-only: it tracks a moving current
          # release, and a Windows claim is made per measured LTS.
          - os: windows-latest
            node: '22.22.2'
          - os: windows-latest
            node: '24.x'
    steps:
      - uses: actions/checkout@v7
        with:
          # The Unreleased gate diffs against an earlier commit, so the history
          # has to be present rather than a single-commit clone.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Resolve the comparison base
        id: base
        # The command writes a shell redirection into `$GITHUB_OUTPUT`; bash is
        # present on both runners (the Windows image ships Git Bash), and asking
        # for it explicitly keeps the command the same text on every leg instead
        # of forking into a PowerShell-only variant.
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: echo "sha=$(node scripts/ci-base.mjs)" >> "$GITHUB_OUTPUT"
      - name: Unreleased gate
        # A push that IS the release consumes the Unreleased entry instead of
        # adding one: the body moves under the new version heading, so the base
        # and HEAD can both have an empty Unreleased while lib/ changed, and the
        # gate would fail the release it is shipping. release.yml already exempts
        # `chore(release):` commits with this same prefix; the checks workflow has
        # to agree or main cannot go green for that release. Only this one step is
        # exempted — every other gate still runs. For pull_request events
        # `head_commit` is null and `startsWith(null, …)` is false, so the `!`
        # keeps the gate running there.
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        run: node scripts/verify-changelog.mjs --base "${{ steps.base.outputs.sha }}"
      # Named separately so a disordered file reports as itself rather than as part
      # of the suite. The same check runs inside `test/repo-gates.test.js`; this
      # step is the cheap, legible version of it.
      - name: Changelog section order
        run: node scripts/changelog-order.mjs
