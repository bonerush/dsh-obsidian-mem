<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
  </marker>
</defs>
<rect width="1200" height="540" fill="#ffffff"/>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }</style>
<rect x="50" y="90" width="170" height="70" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.2"/><text x="135" y="120" font-size="13.5" font-weight="650" fill="#1e293b" text-anchor="middle" opacity="1">回合完成</text><text x="135" y="137.5" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1">turn/end</text>
<rect x="280" y="90" width="190" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="375" y="119.75" font-size="14" font-weight="650" fill="#1e293b" text-anchor="middle" opacity="1">pending</text><text x="375" y="138.25" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1">等待空闲窗口</text>
<rect x="550" y="90" width="190" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="645" y="119.75" font-size="14" font-weight="650" fill="#1e293b" text-anchor="middle" opacity="1">distilling</text><text x="645" y="138.25" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1">调用模型</text>
<rect x="820" y="90" width="210" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="925" y="119.5" font-size="13.5" font-weight="650" fill="#1e293b" text-anchor="middle" opacity="1">完成（applied）</text><text x="925" y="138" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1">校验通过并写入</text>
<path d="M 220 125 L 280 125" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="234.5" y="103.5" width="31" height="18.5" rx="5" fill="#ffffff" opacity="0.96"/><text x="250" y="115" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle" opacity="1">捕获</text>
<path d="M 470 125 L 550 125" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="480.22" y="103.5" width="59.56" height="18.5" rx="5" fill="#ffffff" opacity="0.96"/><text x="510" y="115" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle" opacity="1">空闲 90 秒</text>
<path d="M 740 125 L 820 125" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="754" y="103.5" width="52" height="18.5" rx="5" fill="#ffffff" opacity="0.96"/><text x="780" y="115" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle" opacity="1">校验通过</text>
<rect x="400" y="310" width="220" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="510" y="338.25" font-size="13.5" font-weight="650" fill="#1e293b" text-anchor="middle" opacity="1">deferred</text><text x="510" y="356.75" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1">无路由 / 无绑定</text><text x="510" y="375.25" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1">每个空闲窗口重试</text>
<rect x="740" y="310" width="220" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="850" y="338.25" font-size="13.5" font-weight="650" fill="#1e293b" text-anchor="middle" opacity="1">failed</text><text x="850" y="356.75" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1">达到 maxRetries</text><text x="850" y="375.25" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1">终态；可显式 retry</text>
<path d="M 590 160 L 510 310" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="437.13" y="226.5" width="82.87" height="18.5" rx="5" fill="#ffffff" opacity="0.96"/><text x="520" y="238" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="end" opacity="1">无路由 / 无绑定</text>
<path d="M 700 160 L 800 310" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="780" y="226.5" width="52" height="18.5" rx="5" fill="#ffffff" opacity="0.96"/><text x="780" y="238" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">达到上限</text>
<text x="50" y="470" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" opacity="1">pending / deferred 不是失败；failed 是终态，只能显式重试。</text>
</svg>
